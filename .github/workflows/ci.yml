name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', 'latest']
    name: composer check (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, intl, xml, ctype, fileinfo
      - run: composer setup
      - run: cp apps/starter/.env.example apps/starter/.env && php apps/starter/artisan key:generate
      - run: composer check
